name: Build sf2loader (armhf)

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: sf2-loader

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cross-compiler armhf
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Compilar
        run: make

      - name: Verificar binario
        run: |
          arm-linux-gnueabihf-readelf -h sf2loader | grep -E "Class|Machine|Flags"
          arm-linux-gnueabihf-readelf -A sf2loader | grep -E "Tag_ABI_VFP_args|Tag_CPU_arch|Tag_FP_arch" || true
          arm-linux-gnueabihf-objdump -T sf2loader | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tr '\n' ' '; echo

      - name: Montar pacote
        run: |
          mkdir -p pkg/sf2/libs pkg/sf2/logs
          cp sf2loader pkg/sf2/sf2loader
          cp dist/ShadowFight2-M0.sh pkg/ShadowFight2-M0.sh
          cp dist/sf2/LEIA-ME.txt pkg/sf2/LEIA-ME.txt
          chmod +x pkg/ShadowFight2-M0.sh pkg/sf2/sf2loader
          cd pkg && zip -r ../sf2-m0.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: sf2-m0
          path: sf2-loader/sf2-m0.zip
          if-no-files-found: error
